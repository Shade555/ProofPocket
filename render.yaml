services:
  - type: web
    name: proofpocket
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GEMMA_MODEL_NAME
        value: "google/gemma-2-9b-it"
      # If GEMMA_API_BASE_URL and GEMMA_API_KEY are omitted, ProofPocket
      # runs in explicitly labelled Demo Mode with deterministic synthetic fixtures.
      - key: GEMMA_API_BASE_URL
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      # MongoDB Atlas connection string (optional - falls back to memory store if omitted)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: "proofpocket"
      - key: ATLAS_VECTOR_INDEX_NAME
        value: "vector_index"
      # Sentry telemetry
      - key: NEXT_PUBLIC_SENTRY_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_DSN
        sync: false
